[project]
root = "../oh-gerrymandering"

[chains]
files = [
  "outputs/chains/soft_constraint/congressional/run37_cntyw20.0_mcdw20.0_isoWeight0.25.jsonl",
  "outputs/chains/soft_constraint/congressional/run38_cntyw20.0_mcdw20.0_isoWeight0.25.jsonl",
  "outputs/chains/soft_constraint/congressional/run39_cntyw20.0_mcdw20.0_isoWeight0.25.jsonl",
  "outputs/chains/soft_constraint/congressional/run40_cntyw20.0_mcdw20.0_isoWeight0.25.jsonl",
]
ids = ["run37", "run38", "run39", "run40"]

[analysis]
n_districts = 15
max_districts_per_county = 2
max_maps_per_chain = 1001
output_frequency = 50000
total_proposals = 50000000
ousted_scale = "share"
area_crs = "EPSG:26917"
polsby_projected_crs = "EPSG:5070"

# Baseline municipal arm.  For the PLACE comparison, use OH_pct20.json,
# mode="PLACE", mapping_column="PLACE", the 2024 Place layer, a distinct
# output_namespace such as "place", and inputs.block_metadata set to the
# graph-generation checkpoint data/derived/cblocksMergeMultiPcts_OH.gpkg.
[municipality]
mode = "COUSUB"
graph_json = "data/graph/OHpct20.json"
scalar_column = "MCD"
output_namespace = "cousub"

[inputs]
graph_json = "data/graph/OHpct20.json"
crosswalk_csv = "scripts/oh_block_to_precinct_crosswalk.csv"
plan_manifest = "scripts/manifest.csv"
blocks = "data/raw/tl_2024_39_tabblock20/tl_2024_39_tabblock20.shp"
precincts = "data/derived/pctSF_OH/pctSF_OH.shp"
block_metadata = "data/raw/tl_2024_39_tabblock20/tl_2024_39_tabblock20.shp"
block_shapefile = "data/raw/tl_2024_39_tabblock20/tl_2024_39_tabblock20.shp"
mcd_shapefile = "data/raw/tl_2024_39_cousub/tl_2024_39_cousub.shp"
target_precincts = "data/derived/pctSF_OH/pctSF_OH.shp"
cvap_file = "data/raw/oh_cvap_2023_b.zip"
public_plan_dir = "scripts/plans/public/combined_21_25"
other_csv = "data/other_ensembles/OH.csv"
other_geojson = "data/other_ensembles/OH.geojson"
polsby_traces_json = "../atlas-posthoc/outputs/smoke_full_four_chains_37_40/diagnostics/polsby_popper_traces.json"

[inputs.municipal_trace_collections]
"mcd_w=20, runs 37-40" = "../atlas-posthoc/outputs/smoke_full_four_chains_37_40/diagnostics/municipal_split_traces.json"
"mcd_w=5, runs 53-56" = "../atlas-posthoc/outputs/smoke_full_four_chains_53_56/diagnostics/municipal_split_traces.json"
"mcd_w=1, runs 57-60; not fully mixed" = "../atlas-posthoc/outputs/smoke_full_four_chains_57_60/diagnostics/municipal_split_traces.json"

[plans]
enacted = "scripts/plans/October 31 2025 CD BAF.xlsx"
overturned = "scripts/plans/SubSB258-Block-Assignment-File.xlsx"
remedial = "scripts/plans/March 2 2022 CD BAF.xlsx"

[columns]
block_id = "GEOID20"
block_county = "COUNTYFP20"
block_population = "POP20"
precinct_name = "NAME"
population = "POP20"
official_key = "ORIG_NAME"
mcd_county = "COUNTYFP"
mcd_id = "COUSUBFP"

[elections.layers]
2016 = "data/raw/oh_vest_16/oh_vest_16.shp"
2018 = "data/raw/oh_vest_18/oh_vest_18.shp"
2020 = "data/raw/oh_vest_20/oh_vest_20.shp"
2022 = "data/raw/oh_gen_2022_prec/oh_2022_gen_prec_st.shp"
2024 = "data/raw/oh_2024_gen_prec/oh_2024_gen_all_prec/oh_2024_gen_all_prec.shp"

[outputs]
root = "../atlas-posthoc-plus/outputs"

[figures]
# Set true for title-free Helvetica Neue figures saved as vector PDF.
paper_mode = false

[workflow.polsby-trace]
metric = "average"

[workflow.polsby-histogram]
stat = "average"
burnin = 0
bins = 40
density = false
public_score_method = "graph"
refresh_public_scores = false

[workflow.municipal-tradeoff-weights]
reuse_official_summary = true
reuse_public_summary = true

[workflow.municipal-place-partisanship]
minimum_place_population = 25000
label_count = 3

[workflow.municipal-city-partisan-context]
cities = ["Cleveland", "Columbus", "Cincinnati", "Toledo", "Akron", "Dayton"]
bins = 35

[workflow.municipal-tradeoff-weights-external]
include_other_ensemble = true
reuse_official_summary = true
reuse_public_summary = true
